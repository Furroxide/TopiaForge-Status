name: Deploy status page
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-deployment
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 5
    steps:
      - name: Require main and an existing protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/environments/status-deploy" --jq '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true and ([.protection_rules[] | select(.type == "required_reviewers") | (.reviewers | length)] | any(. > 0))' | grep -qx true
  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: status-deploy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test && npm run check
      - name: Configure the existing database binding
        env:
          STATUS_DATABASE_ID: ${{ secrets.STATUS_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const id=process.env.STATUS_DATABASE_ID;
          if(!/^[0-9a-f-]{36}$/.test(id)||id==='00000000-0000-0000-0000-000000000000')throw new Error('Database binding is missing');
          fs.writeFileSync('wrangler.toml',fs.readFileSync('wrangler.toml','utf8').replace('00000000-0000-0000-0000-000000000000',id));
          NODE
      - name: Apply append-only migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler d1 migrations apply DB --remote
          npm run deploy
      - name: Verify public routes and private ingestion
        run: |
          curl --fail --silent --show-error --max-time 20 https://status.topiaforge.dev/api/status | jq -e '.schema == "topiaforge.public-status/1" and (.environments.production.launched | type == "boolean")'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 -X POST https://status.topiaforge.dev/internal/observations)" = 401
